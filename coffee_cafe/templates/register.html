<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h2>Create Account</h2>

<form method="POST">
{% csrf_token %}

<input type="text"
name="username"
placeholder="Username"
required>

<input type="email"
name="email"
placeholder="Email"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Register
</button>

</form>

<a href="/login/">Already have an account?</a>

</body>
</html>
